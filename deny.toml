# Policy for the shipped Windows application, including build/dev dependencies.
# cargo-audit separately checks every package in Cargo.lock on all platforms.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
# Owner: repository maintainers. Review by 2026-10-23, or on an oxifont update.
# Build-time only: oxifont processes font bytes bundled by locked dependencies.
# No patched release exists; migrate/update the subsetter to remove this crate.
# Keep cargo-audit's warning visible. This does not ignore future vulnerabilities.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is unmaintained; required by oxifont-subset/oxifont-parser 0.2.2 for build-time bundled font subsetting. Owner: repository maintainers; review by 2026-10-23. See docs/dependency-security.md." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# Limit the existing font licenses to this crate.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
# The GUI/Windows dependency graph currently needs multiple crate versions.
multiple-versions = "warn"
wildcards = "deny"
# The app talks to the network only through ureq, in poller::build_agent and
# updater::build_agent. These crates bring a second HTTP stack, an async runtime
# or telemetry; adding one needs a maintainer decision, not an allow.
deny = [
    { crate = "reqwest", reason = "HTTP goes through ureq in poller::build_agent and updater::build_agent" },
    { crate = "hyper", reason = "HTTP goes through ureq in poller::build_agent and updater::build_agent" },
    { crate = "h2", reason = "HTTP goes through ureq in poller::build_agent and updater::build_agent" },
    { crate = "isahc", reason = "HTTP goes through ureq in poller::build_agent and updater::build_agent" },
    { crate = "attohttpc", reason = "HTTP goes through ureq in poller::build_agent and updater::build_agent" },
    { crate = "minreq", reason = "HTTP goes through ureq in poller::build_agent and updater::build_agent" },
    { crate = "surf", reason = "HTTP goes through ureq in poller::build_agent and updater::build_agent" },
    { crate = "ehttp", reason = "HTTP goes through ureq in poller::build_agent and updater::build_agent" },
    { crate = "curl", reason = "HTTP goes through ureq in poller::build_agent and updater::build_agent" },
    { crate = "curl-sys", reason = "HTTP goes through ureq in poller::build_agent and updater::build_agent" },
    { crate = "tungstenite", reason = "the app opens no WebSocket connections" },
    { crate = "tokio", reason = "polling runs on plain threads; an async runtime is not needed" },
    { crate = "async-std", reason = "polling runs on plain threads; an async runtime is not needed" },
    { crate = "sentry", reason = "the app sends no telemetry or crash reports" },
    { crate = "opentelemetry", reason = "the app sends no telemetry" },
    { crate = "posthog-rs", reason = "the app sends no telemetry" },
    { crate = "keyring", reason = "the app never stores credentials; providers read the sign-in their own client stored" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
