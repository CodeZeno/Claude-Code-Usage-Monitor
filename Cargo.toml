[package]
name = "claude-code-usage-monitor"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Claude Code Usage Monitor"
homepage = "https://codezeno.com.au"
repository = "https://github.com/CodeZeno/Claude-Code-Usage-Monitor"

[package.metadata.winres]
CompanyName = "Code Zeno Pty Ltd"
ProductName = "Claude Code Usage Monitor"
FileDescription = "Claude Code Usage Monitor"
OriginalFilename = "claude-code-usage-monitor.exe"
InternalName = "ClaudeCodeUsageMonitor"
Comments = "https://codezeno.com.au"
LegalCopyright = "Copyright (C) 2026 Code Zeno Pty Ltd"

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
eframe = { version = "0.35", default-features = false, features = ["glow"] }
lucide-icons = "1.30"
raw-window-handle = "0.6"
zip = { version = "7.2", default-features = false, features = ["deflate"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
]

[build-dependencies]
epaint_default_fonts = "0.35"
heck = "0.5"
lucide-icons = "1.30"
oxifont-subset = "0.2.2"
proc-macro2 = "1"
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
