[package]
name = "claude-code-usage-monitor"
version = "2.15.14"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Claude Code Usage Monitor"
homepage = "https://codezeno.com.au"
repository = "https://github.com/CodeZeno/Claude-Code-Usage-Monitor"

[package.metadata.winres]
CompanyName = "Code Zeno Pty Ltd"
ProductName = "Claude Code Usage Monitor"
FileDescription = "Claude Code Usage Monitor"
OriginalFilename = "claude-code-usage-monitor.exe"
InternalName = "ClaudeCodeUsageMonitor"
Comments = "https://codezeno.com.au"
LegalCopyright = "Copyright (C) 2026 Code Zeno Pty Ltd"

[dependencies]
# ureq 3.4.0 gates its connector on native-tls; native-tls-no-default alone panics.
# Both agents still select PlatformVerifier to validate against the Windows store.
ureq = { version = "3.4", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
httpdate = "1"
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
eframe = { version = "0.36", default-features = false, features = ["glow", "wgpu"] }
lucide-icons = "1.30"
raw-window-handle = "0.6"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
epaint_default_fonts = "0.36"
heck = "0.5"
lucide-icons = "1.30"
oxifont-subset = "0.2.2"
proc-macro2 = "1"
serde_json = "1"
toml = "1.1"
winres = "0.1"

[patch.crates-io]
# Keep native text copy/paste without arboard's image codecs. See vendor/egui-winit/PATCH.md.
egui-winit = { path = "vendor/egui-winit" }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
